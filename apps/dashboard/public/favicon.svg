<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="#6366f1" stroke-width="4"/>
  <!-- "E" letter with bug feel -->
  <g transform="translate(35, 22)">
    <rect x="0" y="0" width="30" height="6" rx="2" fill="#6366f1"/>
    <rect x="0" y="12" width="22" height="6" rx="2" fill="#6366f1"/>
    <rect x="0" y="24" width="30" height="6" rx="2" fill="#6366f1"/>
    <!-- Antennae -->
    <line x1="30" y1="0" x2="35" y2="-8" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="20" y2="-10" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="35" cy="-8" r="2" fill="#8b5cf6"/>
    <circle cx="20" cy="-10" r="2" fill="#8b5cf6"/>
  </g>
  <!-- Error indicator dot -->
  <circle cx="70" cy="30" r="6" fill="#ef4444" />
  <circle cx="70" cy="30" r="3" fill="#fca5a5" />
</svg>